<body>

<header class="page-hero">
  <p class="eyebrow">Contact</p>
  <h1>Get In Touch</h1>
  <p class="page-hero-tagline">
    Sponsorship, consulting, guest, and general inquiries &mdash; all messages
    go straight to the team.
  </p>
</header>

<main>
  <section id="contact-form">
    <div class="container">
      <form data-form data-contact-email="nabeelishoof@gmail.com" novalidate>
        <div class="form-grid">
          <div class="field">
            <label for="contact-name">Name</label>
            <input type="text" id="contact-name" name="name" required />
          </div>
          <div class="field">
            <label for="contact-email">Email</label>
            <input type="email" id="contact-email" name="email" required />
          </div>
        </div>
        <div class="field">
          <label for="contact-type">Inquiry Type</label>
          <select id="contact-type" name="inquiry_type" required>
            <option value="">Select one&hellip;</option>
            <option value="general">General inquiry</option>
            <option value="sponsorship">Sponsorship inquiry</option>
            <option value="consulting">Consulting inquiry</option>
            <option value="guest">Guest request</option>
          </select>
        </div>
        <div class="field">
          <label for="contact-message">Message</label>
          <textarea id="contact-message" name="message" required></textarea>
        </div>
        <!-- Honeypot: real users never see or fill this field -->
        <div class="field hp-field" aria-hidden="true">
          <label for="contact-company-website">Leave this field blank</label>
          <input type="text" id="contact-company-website" name="company_website" tabindex="-1" autocomplete="off" />
        </div>
        <button type="submit" class="btn">Send Message</button>
        <p class="form-status" role="status"></p>
      </form>
    </div>
  </section>
</main>

<footer>
  <div class="container">
    <p>&copy; 2026 Win With Nabs. Recorded at Grove Podcast Studios, Miami.</p>
    <p><a href="mailto:nabeelishoof@gmail.com">nabeelishoof@gmail.com</a></p>
  </div>
</footer>

<script src="main.js"></script>

</body>
</html>
